<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
  <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Wildlife Whisperer FieldOps — Field operations management for wildlife removal professionals. Jobs, estimates, GPS tracking, photos, signatures, and AI assistance." />
  <meta name="keywords" content="wildlife removal, field operations, pest control, job management, estimates, GPS, photos" />
  <meta name="author" content="Wildlife Whisperer LLC" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FieldOps" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="FieldOps" />
  <meta name="msapplication-TileColor" content="#0a0a0f" />
  <meta name="msapplication-TileImage" content="./assets/icon.png" />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Wildlife Whisperer FieldOps" />
  <meta property="og:description" content="Field operations management for wildlife removal professionals. Offline-first PWA with job tracking, estimates, GPS, and AI." />
  <meta property="og:image" content="./assets/logo.png" />
  <meta property="og:site_name" content="Wildlife Whisperer FieldOps" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Wildlife Whisperer FieldOps" />
  <meta name="twitter:description" content="Field operations management for wildlife removal professionals." />
  <meta name="twitter:image" content="./assets/logo.png" />

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data: https://*.supabase.co https://*.googleapis.com https://*.gstatic.com; connect-src 'self' https://*.supabase.co https://*.supabase.in https://api.openweathermap.org https://maps.googleapis.com https://www.googleapis.com https://vercel.live https://*.vercel-analytics.com https://*.vercel-insights.com; frame-src https://accounts.google.com https://*.google.com; worker-src 'self';" />

  <title>Wildlife Whisperer FieldOps</title>

  <!-- Resource Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="https://api.openweathermap.org" />
  <link rel="dns-prefetch" href="https://maps.googleapis.com" />

  <!-- Styles -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles.css" />
  <link rel="stylesheet" href="./src/grayscale.css" />

  <!-- Icons -->
  <link rel="icon" type="image/png" href="./assets/fieldops-icon.svg" />
  <link rel="apple-touch-icon" href="./assets/fieldops-icon.svg" />
  <link rel="mask-icon" href="./assets/monochrome.svg" color="#808080" />

  <!-- Critical theme script (must be inline, runs before render) -->
  <script>
    (function() {
      const theme = localStorage.getItem('ww_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": "Wildlife Whisperer FieldOps",
    "alternateName": "FieldOps",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "author": {
      "@type": "Organization",
      "name": "Wildlife Whisperer LLC"
    },
    "description": "Field operations management app for wildlife removal professionals. Features job tracking, estimates, GPS mapping, photo documentation, digital signatures, and AI assistance.",
    "featureList": "Job management, Estimate calculator, GPS tracking, Photo gallery, Digital signatures, Offline sync, Weather integration, Calendar sync",
    "softwareVersion": "3.0.0"
  }
  </script>
</head>

<body>
  <!-- Splash Screen -->
  <div id="splash" class="splash" role="status" aria-live="polite" aria-label="Loading application">
    <div class="splash-logo" aria-hidden="true">&#x1F99D;</div>
    <div class="splash-title">Wildlife Whisperer FieldOps</div>
    <div class="splash-subtitle">Loading...</div>
    <div class="splash-spinner" aria-hidden="true"></div>
  </div>

  <!-- No Script Fallback -->
  <noscript>
    <style>
      .splash { display: none !important; }
      #app { display: none !important; }
    </style>
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:Inter,sans-serif;background:#0a0a0f;color:#f8f8f8;text-align:center;">
      <div style="font-size:64px;margin-bottom:16px;">&#x1F99D;</div>
      <h1 style="font-size:24px;margin-bottom:8px;">JavaScript Required</h1>
      <p style="color:#8a8a9e;max-width:400px;line-height:1.6;">Wildlife Whisperer FieldOps is a progressive web app that requires JavaScript to function. Please enable JavaScript in your browser settings and reload the page.</p>
    </div>
  </noscript>

  <!-- App Entry Point -->
  <script type="module" src="./src/main.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            console.log('[SW] Registered:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[SW] Registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>
