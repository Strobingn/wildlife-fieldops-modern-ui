services:
  agent:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - agent
    ports:
      - "80:80"
      - "443:443"
    environment:
      AGENT_DOMAIN: ${AGENT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
