name: Unit Tests

# Runs the JVM unit tests that the APK build (build-android.yml) never executes:
# app-module tests and the observation-core module tests.
# No secrets are required: the unit tests run against placeholder build config.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run unit tests
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :observation-core:test --no-daemon --stacktrace 2>&1 | tee test.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            observation-core/build/reports/tests/
            test.log
          if-no-files-found: ignore
          retention-days: 14
