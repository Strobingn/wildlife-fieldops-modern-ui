name: Build Native Android APK (Debug)

on:
  push:
    branches: [ main, Field_Opps_V2.5, chatgptV25, GrokAIV5 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      GOOGLE_MAPS_API: ${{ secrets.GOOGLE_MAPS_API || secrets.GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API }}
      VITE_GOOGLE_MAPS_API: ${{ secrets.GOOGLE_MAPS_API || secrets.GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API }}
      OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://api.x.ai/v1
      LLM_MODEL: grok-4.5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools extras;google;m2repository'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Verify Maps secret (no value printed)
        run: |
          if [ -z "${GOOGLE_MAPS_API}" ]; then
            echo "::warning::Google Maps key is not configured; add GOOGLE_MAPS_API as a repository secret."
          else
            echo "GOOGLE_MAPS_API present (length ${#GOOGLE_MAPS_API})"
          fi

      - name: Verify AI secrets (no values printed)
        run: |
          set -e
          if [ -z "${XAI_API_KEY}" ] && [ -n "${LLM_API_KEY}" ]; then
            export XAI_API_KEY="${LLM_API_KEY}"
            echo "Using LLM_API_KEY as XAI_API_KEY fallback"
          fi
          if [ -n "${XAI_API_KEY}" ]; then
            export XAI_API_KEY="$(printf '%s' "$XAI_API_KEY" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          fi
          if [ -n "${LLM_API_KEY}" ]; then
            export LLM_API_KEY="$(printf '%s' "$LLM_API_KEY" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          fi
          echo "XAI_API_KEY length: ${#XAI_API_KEY}"
          echo "LLM_API_KEY length: ${#LLM_API_KEY}"
          echo "LLM_BASE_URL: ${LLM_BASE_URL}"
          echo "LLM_MODEL: ${LLM_MODEL}"
          if [ "${#XAI_API_KEY}" -lt 10 ] && [ "${#LLM_API_KEY}" -lt 10 ]; then
            echo "::warning::No usable XAI_API_KEY or LLM_API_KEY secret — AI will be offline in this APK. Add repo secret XAI_API_KEY and rebuild."
          else
            echo "AI key present for BuildConfig bake-in."
          fi
          echo "XAI_API_KEY=$XAI_API_KEY" >> "$GITHUB_ENV"
          echo "LLM_API_KEY=$LLM_API_KEY" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          set -o pipefail
          export GRADLE_OPTS="-Xmx6g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"
          export XAI_API_KEY="${XAI_API_KEY}"
          export LLM_API_KEY="${LLM_API_KEY}"
          export LLM_BASE_URL="${LLM_BASE_URL:-https://api.x.ai/v1}"
          export LLM_MODEL="${LLM_MODEL:-grok-4.5}"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        timeout-minutes: 30

      - name: Check for APK and list outputs
        run: |
          set -e
          echo "=== Checking for debug APKs ==="
          find app/build/outputs -name "*.apk" -type f
          ls -la app/build/outputs/apk/debug/
          test -n "$(ls -A app/build/outputs/apk/debug/*.apk 2>/dev/null)"
          echo "=== End check ==="

      - name: Name phone-install APK
        if: success()
        run: |
          set -e
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$SRC" app/build/outputs/apk/debug/wildlife-fieldops-grokai-v5.apk
          ls -la app/build/outputs/apk/debug/

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wildlife-field-ops-debug-apk
          path: |
            app/build/outputs/apk/debug/wildlife-fieldops-grokai-v5.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish APK on Releases (phone download)
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/GrokAIV5')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/GrokAIV5' && 'grokai-v5-latest' || 'debug-latest' }}
          name: ${{ github.ref == 'refs/heads/GrokAIV5' && 'Wildlife FieldOps GrokAIV5 APK' || 'Wildlife Field Ops Debug APK' }}
          files: |
            app/build/outputs/apk/debug/wildlife-fieldops-grokai-v5.apk
            app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Phone-install APK from `${{ github.sha }}` (run ${{ github.run_number }}, branch `${{ github.ref_name }}`).
            Download `wildlife-fieldops-grokai-v5.apk` and install (unknown sources).
            This is a real `.apk`, not a zip.

      - name: Summary
        if: success()
        run: |
          echo "Wildlife Field Ops Debug APK built successfully."
          echo "Phone download: https://github.com/Strobingn/wildlife-fieldops-modern-ui/releases/tag/grokai-v5-latest"
