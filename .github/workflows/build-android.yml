name: Build Native Android APK (Debug)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Normalize any existing Maps secret name into the native Gradle variable.
      # GOOGLE_MAPS_API is preferred; the other names remain supported for
      # compatibility with older branch/setup configurations.
      GOOGLE_MAPS_API: ${{ secrets.GOOGLE_MAPS_API || secrets.GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API }}
      VITE_GOOGLE_MAPS_API: ${{ secrets.GOOGLE_MAPS_API || secrets.GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API }}
      OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://api.x.ai/v1
      LLM_MODEL: grok-4.5
      DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools extras;google;m2repository'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Decode CI debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_B64:-}" ] || [ -z "${DEBUG_KEYSTORE_PASSWORD:-}" ]; then
            echo "No DEBUG_KEYSTORE_B64 / DEBUG_KEYSTORE_PASSWORD secrets (fork PR or local). Using the default Android debug key."
            echo "HAS_CI_DEBUG_KEYSTORE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          umask 077
          KEYSTORE_PATH="${RUNNER_TEMP}/fieldops-debug.p12"
          printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded CI debug keystore is empty"
            exit 1
          fi
          echo "DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "HAS_CI_DEBUG_KEYSTORE=true" >> "$GITHUB_ENV"
          echo "CI debug keystore written (${#DEBUG_KEYSTORE_B64} b64 chars, $(wc -c < "$KEYSTORE_PATH") bytes). Password not printed."

      - name: Verify Maps secret (no value printed)
        run: |
          if [ -z "${GOOGLE_MAPS_API}" ]; then
            echo "::warning::Google Maps key is not configured; add GOOGLE_MAPS_API as a repository secret."
          else
            echo "GOOGLE_MAPS_API present (length ${#GOOGLE_MAPS_API})"
          fi

      - name: Verify AI secrets (no values printed)
        run: |
          set -e
          if [ -z "${XAI_API_KEY}" ] && [ -n "${LLM_API_KEY}" ]; then
            export XAI_API_KEY="${LLM_API_KEY}"
            echo "Using LLM_API_KEY as XAI_API_KEY fallback"
          fi
          if [ -n "${XAI_API_KEY}" ]; then
            export XAI_API_KEY="$(printf '%s' "$XAI_API_KEY" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          fi
          if [ -n "${LLM_API_KEY}" ]; then
            export LLM_API_KEY="$(printf '%s' "$LLM_API_KEY" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          fi
          echo "XAI_API_KEY length: ${#XAI_API_KEY}"
          echo "LLM_API_KEY length: ${#LLM_API_KEY}"
          echo "LLM_BASE_URL: ${LLM_BASE_URL}"
          echo "LLM_MODEL: ${LLM_MODEL}"
          if [ "${#XAI_API_KEY}" -lt 10 ] && [ "${#LLM_API_KEY}" -lt 10 ]; then
            echo "::warning::No usable XAI_API_KEY or LLM_API_KEY secret — AI will be offline in this APK. Add repo secret XAI_API_KEY and rebuild."
          else
            echo "AI key present for BuildConfig bake-in."
          fi
          echo "XAI_API_KEY=$XAI_API_KEY" >> "$GITHUB_ENV"
          echo "LLM_API_KEY=$LLM_API_KEY" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          set -o pipefail
          export GRADLE_OPTS="-Xmx6g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"
          export XAI_API_KEY="${XAI_API_KEY}"
          export LLM_API_KEY="${LLM_API_KEY}"
          export LLM_BASE_URL="${LLM_BASE_URL:-https://api.x.ai/v1}"
          export LLM_MODEL="${LLM_MODEL:-grok-4.5}"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        timeout-minutes: 30

      - name: Check for APK and list outputs
        run: |
          set -e
          echo "=== Checking for debug APKs ==="
          find app/build/outputs -name "*.apk" -type f
          ls -la app/build/outputs/apk/debug/
          test -n "$(ls -A app/build/outputs/apk/debug/*.apk 2>/dev/null)"
          echo "=== End check ==="

      - name: Unit tests
        run: |
          set -o pipefail
          export GRADLE_OPTS="-Xmx6g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"
          ./gradlew :app:testDebugUnitTest :observation-core:test --no-daemon --stacktrace
        timeout-minutes: 25

      - name: Verify CI debug APK signer
        if: success() && env.HAS_CI_DEBUG_KEYSTORE == 'true'
        run: |
          set -euo pipefail
          EXPECTED="EC:75:D0:BC:BC:62:30:6B:0C:38:91:76:9E:05:4C:EB:C7:7C:6A:84:4D:11:9B:40:18:B9:0C:7E:F7:57:0C:A6"
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -x "${SDK}/build-tools/35.0.0/apksigner" ]; then
            APKSIGNER="${SDK}/build-tools/35.0.0/apksigner"
          else
            APKSIGNER="$(find "$SDK/build-tools" -name apksigner | sort | tail -n 1)"
          fi
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK/build-tools"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          echo "APK: $APK"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERTS"
          GOT="$(printf '%s\n' "$CERTS" | grep -i 'SHA-256 digest' | head -n 1 | awk '{print $NF}')"
          normalize() { printf '%s' "$1" | tr '[:lower:]' '[:upper:]' | tr -d ' :'; }
          if [ "$(normalize "$GOT")" != "$(normalize "$EXPECTED")" ]; then
            echo "::error::APK signer SHA-256 mismatch. expected=$EXPECTED got=$GOT"
            exit 1
          fi
          echo "Signer SHA-256 matches $EXPECTED"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wildlife-field-ops-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Set release tag from branch
        if: success() && github.event_name == 'push' && env.HAS_CI_DEBUG_KEYSTORE == 'true'
        id: apk_tag
        run: |
          RAW="${GITHUB_REF_NAME}"
          SAFE="$(printf '%s' "$RAW" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')"
          if [ "$RAW" = "main" ] || [ "$RAW" = "master" ]; then
            TAG="debug-latest"
            TITLE="Wildlife Field Ops Debug APK"
          else
            TAG="apk-${SAFE}-latest"
            TITLE="Wildlife FieldOps APK (${RAW})"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          BODY_PATH="${RUNNER_TEMP}/fieldops-release-body.md"
          {
            echo "Native Kotlin / Jetpack Compose debug APK from \`${{ github.sha }}\` (run ${{ github.run_number }}, branch \`${{ github.ref_name }}\`)."
            echo "Direct download: the \`.apk\` asset on this release (no unzip)."
            echo "Actions artifact name remains \`wildlife-field-ops-debug-apk\`."
            if [ "$RAW" = "main" ] || [ "$RAW" = "master" ]; then
              echo
              echo "In-app updates read only this \`${TAG}\` release (channel \`main\`). Branch/PR APKs are not offered in the app."
            else
              echo
              echo "This branch/PR build is **not** an in-app update source. The app only checks \`debug-latest\`."
            fi
          } > "$BODY_PATH"
          echo "body_path=$BODY_PATH" >> "$GITHUB_OUTPUT"
          {
            echo "assets<<EOF"
            echo "app/build/outputs/apk/debug/*.apk"
            if [ "$RAW" = "main" ] || [ "$RAW" = "master" ]; then
              echo "app/build/outputs/update/update.json"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing release tag: $TAG"

      - name: Write main-channel update.json
        if: success() && github.event_name == 'push' && env.HAS_CI_DEBUG_KEYSTORE == 'true' && (github.ref_name == 'main' || github.ref_name == 'master')
        env:
          BODY_PATH: ${{ steps.apk_tag.outputs.body_path }}
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT=""
          if [ -x "${SDK}/build-tools/35.0.0/aapt" ]; then
            AAPT="${SDK}/build-tools/35.0.0/aapt"
          else
            AAPT="$(find "$SDK/build-tools" -name aapt -type f | sort | tail -n 1)"
          fi
          if [ -z "$AAPT" ] || [ ! -x "$AAPT" ]; then
            echo "::error::aapt not found under $SDK/build-tools"
            exit 1
          fi
          BADGING="$("$AAPT" dump badging "$APK")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          if [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionCode from APK badging"
            exit 1
          fi
          APK_URL="https://github.com/${{ github.repository }}/releases/download/debug-latest/app-debug.apk"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          PREV_SHA=""
          if curl -fsSL -A "WildlifeFieldOps-CI" \
            "https://github.com/${{ github.repository }}/releases/download/debug-latest/update.json" \
            -o "${RUNNER_TEMP}/prev-update.json"; then
            PREV_SHA="$(python3 -c "import json; print(json.load(open('${RUNNER_TEMP}/prev-update.json')).get('commitSha',''))" || true)"
          fi
          CHANGELOG=""
          if [ -n "$PREV_SHA" ] && git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
            CHANGELOG="$(git log --pretty=format:'- %s' --no-merges "${PREV_SHA}..${{ github.sha }}" | head -n 20)"
          else
            CHANGELOG="$(git log --pretty=format:'- %s' --no-merges -15)"
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Main build ${{ github.sha }}"
          fi
          mkdir -p app/build/outputs/update
          jq -n \
            --argjson schemaVersion 1 \
            --arg channel "main" \
            --arg tag "debug-latest" \
            --arg packageName "com.strobingn.wildlifefieldops" \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg apkAssetName "app-debug.apk" \
            --arg commitSha "${{ github.sha }}" \
            --arg buildTime "$BUILD_TIME" \
            --argjson runNumber "${{ github.run_number }}" \
            --arg changelog "$CHANGELOG" \
            '{
              schemaVersion: $schemaVersion,
              channel: $channel,
              tag: $tag,
              packageName: $packageName,
              versionCode: $versionCode,
              versionName: $versionName,
              apkUrl: $apkUrl,
              apkAssetName: $apkAssetName,
              commitSha: $commitSha,
              buildTime: $buildTime,
              runNumber: $runNumber,
              changelog: $changelog
            }' > app/build/outputs/update/update.json
          cat app/build/outputs/update/update.json
          {
            echo
            echo "<!-- fieldops-update"
            echo "versionCode=${VERSION_CODE}"
            echo "versionName=${VERSION_NAME}"
            echo "channel=main"
            echo "tag=debug-latest"
            echo "packageName=com.strobingn.wildlifefieldops"
            echo "apkUrl=${APK_URL}"
            echo "commitSha=${{ github.sha }}"
            echo "buildTime=${BUILD_TIME}"
            echo "runNumber=${{ github.run_number }}"
            echo "-->"
            echo
            echo "## In-app update"
            echo "- Machine-readable: \`update.json\` on this release (only \`debug-latest\` / channel \`main\`)."
            echo "- versionCode: \`${VERSION_CODE}\`"
            echo "- versionName: \`${VERSION_NAME}\`"
            echo
            echo "### Changes since last main build"
            echo "$CHANGELOG"
          } >> "$BODY_PATH"
          echo "Wrote app/build/outputs/update/update.json versionCode=${VERSION_CODE} versionName=${VERSION_NAME}"

      - name: Publish APK on Releases (easy download)
        if: success() && github.event_name == 'push' && env.HAS_CI_DEBUG_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_tag.outputs.tag }}
          name: ${{ steps.apk_tag.outputs.title }}
          files: ${{ steps.apk_tag.outputs.assets }}
          body_path: ${{ steps.apk_tag.outputs.body_path }}
          fail_on_unmatched_files: true
          make_latest: false

      - name: Remove stale debug zip from debug-latest
        if: success() && github.event_name == 'push' && env.HAS_CI_DEBUG_KEYSTORE == 'true' && (github.ref_name == 'main' || github.ref_name == 'master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/debug-latest" \
            --jq '.assets[] | select(.name=="WildlifeFieldOps-main-debug.zip") | .id' | tr -d '[:space:]')"
          if [ -n "${ASSET_ID}" ]; then
            echo "Deleting stale WildlifeFieldOps-main-debug.zip asset ${ASSET_ID}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
          else
            echo "WildlifeFieldOps-main-debug.zip is not on debug-latest"
          fi

      - name: Summary
        if: success()
        run: |
          echo "Wildlife Field Ops Debug APK built successfully."
          echo "versionCode uses 1000000 + GITHUB_RUN_NUMBER=${{ github.run_number }} in CI."
          if [ "${{ github.event_name }}" = "push" ] && [ "${HAS_CI_DEBUG_KEYSTORE:-false}" = "true" ]; then
            TAG="${{ steps.apk_tag.outputs.tag }}"
            echo "Public download: https://github.com/${{ github.repository }}/releases/download/${TAG}/app-debug.apk"
            if [ "$TAG" = "debug-latest" ]; then
              echo "In-app update manifest: https://github.com/${{ github.repository }}/releases/download/debug-latest/update.json"
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR builds upload Artifacts only (no Releases publish)."
          else
            echo "Release tag not published (push-only, and only when the CI debug keystore secret is present)."
          fi

